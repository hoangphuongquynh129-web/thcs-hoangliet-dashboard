
name: Test Dashboard API V3.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Test V3.1 endpoint
        env:
          API_URL: ${{ secrets.DASHBOARD_API_V31_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          url = os.environ["API_URL"]

          if not (
              url.startswith("https://script.google.com/macros/s/")
              and url.endswith("/exec")
          ):
              raise ValueError("Invalid Apps Script URL")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "HoangLietDashboard-Test/3.1"}
          )

          with urllib.request.urlopen(request, timeout=45) as response:
              data = json.load(response)

          if data.get("status") != "success":
              raise ValueError("API V3.1 did not return success")

          overview = data.get("data", {})

          for key in ("students", "classes", "staff", "campuses"):
              value = overview.get(key)
              if type(value) is not int or value < 0:
                  raise ValueError(f"Invalid {key}")

          print("API V3.1 responded successfully")
          print("Overview:", {
              key: overview[key]
              for key in ("students", "classes", "staff", "campuses")
          })
          PY
