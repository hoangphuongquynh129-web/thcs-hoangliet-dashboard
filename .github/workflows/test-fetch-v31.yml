
name: Test Fetch Dashboard V3.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch V3.1 data
        env:
          DASHBOARD_API_V31_URL: ${{ secrets.DASHBOARD_API_V31_URL }}
        run: python scripts/fetch_data_v31.py

      - name: Check generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("public/dashboard-v31-test.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print("School:", data["school"])
          print("School year:", data["schoolYear"])
          print("Overview:", data["data"])
          print("JSON test passed")
          PY

      - name: Upload V3.1 JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-v31-json
          path: public/dashboard-v31-test.json
          if-no-files-found: error
          retention-days: 7
