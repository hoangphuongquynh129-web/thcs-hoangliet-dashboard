
name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Verify published files
        shell: bash
        run: |
          set -euo pipefail

          test -s public/index.html
          test -s public/dashboard.json

          python -m json.tool public/dashboard.json > /dev/null

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path('public/dashboard.json').read_text(encoding='utf-8')
          )

          if payload.get('status') != 'success':
              raise SystemExit('Invalid dashboard status')

          totals = payload.get('data', {})
          for key in ('students', 'classes', 'staff', 'campuses'):
              value = totals.get(key)
              if type(value) is not int or value < 0:
                  raise SystemExit(f'Invalid total: {key}')

          print('PASS: Published Dashboard files are valid')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
