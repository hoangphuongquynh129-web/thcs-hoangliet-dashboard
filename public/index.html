<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | THCS Hoàng Liệt</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#183153;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce5f0;padding:24px max(24px,calc((100vw - 1120px)/2))}header small{color:#53709a;letter-spacing:.1em;font-weight:700}h1{margin:8px 0 0;font-size:clamp(24px,4vw,36px)}main{max-width:1120px;margin:40px auto;padding:0 24px}.sub{color:#63758b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}.card{background:white;border:1px solid #e1e8f2;border-radius:16px;padding:26px;box-shadow:0 6px 20px #1e41600b;border-top:5px solid var(--accent)}.number{font-size:clamp(26px,4vw,42px);font-weight:800;margin:12px 0}.label{color:#52647a;font-weight:600}footer{margin-top:32px;color:#687b92;font-size:14px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body><header><small>TRƯỜNG THCS HOÀNG LIỆT</small><h1>Dashboard quản trị nhà trường</h1><p class="sub">Năm học 2026–2027</p></header><main><h2>Tổng quan</h2><p class="sub">Các chỉ số thống kê toàn trường</p><div class="grid"><article class="card" style="--accent:#2478e5"><div class="label">Học sinh</div><div id="students" class="number">—</div></article><article class="card" style="--accent:#16a078"><div class="label">Lớp học</div><div id="classes" class="number">—</div></article><article class="card" style="--accent:#e7a124"><div class="label">CBGVNV</div><div id="staff" class="number">—</div></article><article class="card" style="--accent:#8a61c6"><div class="label">Cơ sở</div><div id="campuses" class="number">—</div></article></div><footer id="status">Đang tải dữ liệu thống kê...</footer></main><script>
(async()=>{try{const r=await fetch('./dashboard.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const obj=await r.json();for(const key of ['students','classes','staff','campuses']){if(!Number.isInteger(obj.data?.[key]))throw Error('Thiếu chỉ số '+key);document.getElementById(key).textContent=new Intl.NumberFormat('vi-VN').format(obj.data[key]);}document.getElementById('status').textContent='Dữ liệu từ Google Apps Script · Thời điểm API: '+(obj.updatedAt?new Date(obj.updatedAt).toLocaleString('vi-VN'):'chưa xác định');}catch(err){document.getElementById('status').textContent='Không tải được dữ liệu. Vui lòng kiểm tra GitHub Actions: '+err.message;}})();
</script></body></html>
